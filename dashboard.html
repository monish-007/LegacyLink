<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegacyLink | Developer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-8 flex flex-col items-center font-sans">

    <div class="max-w-4xl w-full">
        <header class="mb-10 border-b border-slate-700 pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                    LegacyLink Engine
                </h1>
                <p class="text-slate-400 mt-2">Autonomous SOAP-to-REST API Modernization</p>
            </div>
            <div class="text-right">
                <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 rounded-full text-sm font-mono border border-emerald-500/30">System Online</span>
            </div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left Side: Control Panel -->
            <div class="glass-panel p-6 rounded-xl shadow-2xl flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold mb-2">REST API Wrapper</h2>
                    <p class="text-slate-400 text-sm mb-6">Fetch the strictly-typed JSON data autonomously mapped from the legacy XML monolith.</p>
                </div>
                <button onclick="fetchModernData()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-all shadow-[0_0_15px_rgba(37,99,235,0.5)]">
                    ⚡ Execute GET /v1/customer-data
                </button>
                
                <div class="mt-6 border-t border-slate-700 pt-4">
                    <p class="text-xs text-slate-500 font-mono">Dodo Payments Metering: <span class="text-emerald-400">ACTIVE</span></p>
                </div>
            </div>

            <!-- Right Side: The Output Window -->
            <div class="glass-panel p-6 rounded-xl shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Live JSON Response</h2>
                    <span id="status-badge" class="px-2 py-1 bg-slate-700 text-slate-300 rounded text-xs font-mono">Awaiting Request...</span>
                </div>
                <div class="bg-slate-900 rounded-lg p-4 h-64 overflow-y-auto border border-slate-700">
                    <pre id="json-output" class="text-sm font-mono text-emerald-400">{}</pre>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function fetchModernData() {
            const output = document.getElementById('json-output');
            const badge = document.getElementById('status-badge');
            
            output.innerText = "Fetching and parsing data...";
            badge.innerText = "Processing...";
            badge.className = "px-2 py-1 bg-blue-900 text-blue-300 rounded text-xs font-mono";

            try {
                // Calls the endpoint Codex just generated for you
                const response = await fetch('/v1/customer-data');
                const data = await response.json();
                
                output.innerText = JSON.stringify(data, null, 4);
                badge.innerText = "200 OK";
                badge.className = "px-2 py-1 bg-emerald-900 text-emerald-300 rounded text-xs font-mono";
            } catch (error) {
                output.innerText = "Error: Make sure the FastAPI server is running!";
                badge.innerText = "500 ERROR";
                badge.className = "px-2 py-1 bg-red-900 text-red-300 rounded text-xs font-mono";
            }
        }
    </script>
</body>
</html>
